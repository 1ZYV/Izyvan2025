<div class="flex flex-col gap-5">
  <div class="flex flex-row justify-between mx-4 gap-6">
    @for (type of vehicleTypes; track type.value) {
    <input
      type="radio"
      name="vehicleType"
      [value]="type.value"
      [(ngModel)]="selectedVehicleType"
      class="hidden"
    />
    <div
      class="border-2 max-w-[150px] w-full text-center justify-center cursor-pointer border-gray-300 transition rounded-lg p-4 flex flex-col items-center"
      [ngClass]="{
        'border-blue-500 bg-blue-500 text-white ring-4 ring-blue-200':
          selectedVehicleType === type.value
      }"
      (click)="selectVehicleType(type.value)"
    >
      <img
        [src]="type.image"
        [alt]="type.alt"
        class="w-16 h-16 object-contain mb-2"
      />
      <div
        class="font-semibold transition"
        [ngClass]="{ 'text-white': selectedVehicleType === type.value }"
      >
        {{ type.label }}
      </div>
      <div
        class="text-sm text-gray-500 transition"
        [ngClass]="{ 'text-white': selectedVehicleType === type.value }"
      >
        {{ type.description }}
      </div>
    </div>
    }
  </div>
</div>
