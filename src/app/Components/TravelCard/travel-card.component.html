<div [class]="cardCssClasses()" (click)="onCardClick()">
    <div class="travel-card-content">
        <!-- Información principal -->
        <div class="travel-info">
            @if (showImage()) {
            <div class="travel-image">
                @if (imageUrl()) {
                <img [src]="imageUrl()" [alt]="travel().title" />
                } @else {
                <div class="image-placeholder"></div>
                }
            </div>
            }

            <div class="travel-details">
                <h4 class="travel-title">{{ travel().title }}</h4>
                <p class="travel-datetime">{{ travel().date }} • {{ travel().time }}</p>
                @if (travel().destination) {
                <p class="travel-destination">{{ travel().destination }}</p>
                }

                <!-- Información del conductor con placeholder -->
                <p class="travel-driver" [class.travel-driver--placeholder]="isPendingOrNoDriver()">
                    @if (isPendingOrNoDriver()) {
                    <span class="driver-placeholder-icon">👤</span>
                    }
                    {{ driverText() }}
                </p>
            </div>
        </div>

        <!-- Acciones y estado -->
        <div class="travel-actions">
            @if (showStatus()) {
            <cp-badge [label]="statusConfig().label" [shape]="'pill'" [size]="'sm'" [style]="statusConfig().style"
                [variant]="statusConfig().variant">
            </cp-badge>
            }

            @if (showPrice()) {
            <cp-currency [label]="travel().price" />
            }

            <a [routerLink]="detailsLink()" class="details-link" (click)="onDetailsClick($event)">
                Ver detalles
            </a>
        </div>
    </div>
</div>
