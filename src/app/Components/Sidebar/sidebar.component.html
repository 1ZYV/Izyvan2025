<nav class="flex flex-col w-full h-full gap-3 px-5 pt-4 text-white bg-slate-900">

        <div class="p-4 bg-white size-3"></div>
        <span class="p-2 text-xl font-bold">IzyTracking</span>
    </div> @for (item of items; track $index) {
    @if (hasAccess(item.roles, item.providerType) ) {

    }
    } <div class="flex flex-col items-start justify-start gap-2 px-4 mt-auto mb-4">

            <img src="" alt="Profile Picture" class="w-10 h-10 bg-white rounded-full">
            <div class="flex flex-col flex-1 gap-1">
                <span class="text-sm font-semibold">{{ currentUser?.name || 'Usuario' }}</span>
