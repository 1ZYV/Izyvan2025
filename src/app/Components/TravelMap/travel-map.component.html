<div class="travel-map-container" [style.height]="height()" (click)="onMapContainerClick()">

    <!-- Contenedor principal del mapa -->
    <div class="map-content">

        <!-- Punto de origen -->
        <div class="location-point origin-point" (click)="onOriginClick()" [class.interactive]="interactive()">
            <div class="point-circle origin-circle">
                <div class="point-dot"></div>
            </div>
            <div class="location-label origin-label">
                <span class="location-name">{{ origin().name }}</span>
                @if (origin().address) {
                <span class="location-address">{{ origin().address }}</span>
                }
            </div>
        </div>

        <!-- Línea de ruta -->
        @if (showRoute()) {
        <div class="route-connection" (click)="onRouteLineClick()">
            <div class="route-line"></div>
            <div class="route-dots">
                <div class="route-dot"></div>
                <div class="route-dot"></div>
                <div class="route-dot"></div>
            </div>
        </div>
        }

        <!-- Punto de destino -->
        <div class="location-point destination-point" (click)="onDestinationClick()"
            [class.interactive]="interactive()">
            <div class="point-circle destination-circle">
                <div class="point-dot"></div>
            </div>
            <div class="location-label destination-label">
                <span class="location-name">{{ destination().name }}</span>
                @if (destination().address) {
                <span class="location-address">{{ destination().address }}</span>
                }
            </div>
        </div>

    </div>

    <!-- Información adicional -->
    @if (routeInfo()) {
    <div class="route-info">
        <span class="route-info-text">{{ routeInfo() }}</span>
    </div>
    }

    <!-- Efecto de fondo con patrón de mapa -->
    <div class="map-background">
        <div class="map-grid"></div>
    </div>
</div>
