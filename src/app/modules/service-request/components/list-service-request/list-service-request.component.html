<div class="w-full px-10 h-full">
  <div
    class="-mt-10 max-h-[400px] rounded-lg h-full bg-gradient-to-b from-green-300 to-white flex flex-col justify-between"
  >
    <div class=""></div>
    <div class="w-full h-[150px] px-6 py-3 rounded-b-lg bg-white">
      <h2 class="text-3xl font-semibold">Actividad reciente de Servicios</h2>

      <div class="flex flex-row mt-3.5">
        <a
          [routerLink]="['create']"
          class="px-5 py-2 bg-gray-200 flex flex-row gap-2 rounded-3xl text-black items-center hover:bg-gray-300 transition duration-300 ease-in-out"
        >
          <span>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-6 w-6 inline-block mr-2"
              viewBox="0 0 20 20"
              fill="currentColor"
              aria-hidden="true"
            >
              <path
                fill-rule="evenodd"
                d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-13a1 1 0 00-2 0v4.586l-1.293 1.293a1 1 0 001.414 1.414L10 10.414V5z"
                clip-rule="evenodd"
              />
            </svg>
          </span>
          <span class="text-lg font-semibold">Agendar nuevo Servicio</span></a
        >
      </div>
    </div>
  </div>

  <div class="overflow-x-auto mt-5 px-6 pb-2 py-4 bg-white rounded-xl">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-2xl font-semibold flex gap-3.5 items-center">
        <span> Lista de Servicios </span>
        <button
          class="ml-2 hover:scale-105 px-3 py-2 rounded-lg transition duration-300 ease-in-out gap-3 bg-gradient-to-tl from-black to-[200%] to-white text-white flex items-center cursor-pointer"
        >
          <span class="text-base">Actualizar</span>
          <span>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-6 w-6"
              viewBox="0 0 24 24"
              fill="currentColor"
              aria-hidden="true"
            >
              <path
                d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"
              />
            </svg>
          </span>
        </button>
      </h2>
      <div class="flex items-center gap-2">
        <input
          type="text"
          placeholder="Buscar..."
          class="px-4 py-2 min-w-sm border-b rounded-lg rounded-b-none focus:outline-none"
        />
      </div>
    </div>
    <div class="flex justify-center">
      <table class="w-full mt-5 bg-white rounded-xl">
        <thead class="text-gray-600 text-sm uppercase font-semibold">
          <tr>
            <th class="px-6 py-3 text-center">Vehiculo</th>
            <th class="px-6 py-3 text-center">Nombre</th>
            <th class="px-6 py-3 text-center">Estado</th>
            <th class="px-6 py-3 text-center">Fecha</th>
            <th class="px-6 py-3 text-center">Acciones</th>
          </tr>
        </thead>
        <tbody class="text-gray-600 text-sm font-light">
          <tr class="border-b border-gray-200 text-center">
            <td class="px-6 py-4 whitespace-nowrap"></td>
            <td class="px-6 py-4 whitespace-nowrap">Servicio 1</td>
            <td class="px-6 py-4 whitespace-nowrap">Pendiente</td>
            <td class="px-6 py-4 whitespace-nowrap">2023/10/01</td>
            <td
              class="px-6 py-4 whitespace-nowrap flex flex-row gap-4 justify-center"
            >
              <button
                class="text-white cursor-pointer rounded-lg font-semibold bg-gradient-to-bl from-blue-500 to-blue-700 px-5 py-2 hover:brightness-110 transition"
              >
                Ver
              </button>
              <button
                class="text-white rounded-lg font-semibold bg-gradient-to-bl from-red-400 to-red-700 px-5 py-2 transition cursor-pointer hover:brightness-110"
              >
                Cancelar
              </button>
            </td>
          </tr>
          <!-- Repeat rows as needed -->
        </tbody>
      </table>
    </div>
  </div>
</div>
