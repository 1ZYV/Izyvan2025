<div class="w-full px-10 h-full flex flex-col gap-5">
  <h1 class="text-4xl font-semibold">Solicitudes de Servicios</h1>
  <div
    class="max-h-[400px] rounded-lg h-full bg-gradient-to-b from-gray-200 to-transparent flex flex-col justify-between"
  >
    <div class="flex flex-row justify-around overflow-y-hidden py-5 px-3.5 gap-6">
      @for (serviceRequest of serviceRequests; track $index) {
      <app-service-request-card [serviceRequest]="serviceRequest" />
      }
    </div>
    <div
      class="w-full h-[150px] px-6 py-3 rounded-b-lg bg-black text-white flex flex-col justify-center gap-4"
    >
      <h2 class="text-3xl font-semibold">Actividad reciente de Servicios</h2>

      <div class="flex flex-row mt-3.5">
        <a
          [routerLink]="['create']"
          class="px-5 py-2 bg-gray-200 flex flex-row gap-2 rounded-3xl text-black items-center hover:bg-gray-300 transition duration-300 ease-in-out"
        >
          <span>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-6 w-6 inline-block mr-2"
              viewBox="0 0 20 20"
              fill="currentColor"
              aria-hidden="true"
            >
              <path
                fill-rule="evenodd"
                d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-13a1 1 0 00-2 0v4.586l-1.293 1.293a1 1 0 001.414 1.414L10 10.414V5z"
                clip-rule="evenodd"
              />
            </svg>
          </span>
          <span class="text-lg font-semibold">Agendar nuevo Servicio</span></a
        >
      </div>
    </div>
  </div>

  <div class="overflow-x-auto mt-5 px-6 pb-2 py-4 bg-white rounded-xl">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-2xl font-semibold flex gap-3.5 items-center">
        <span> Lista de Servicios </span>
        <button
          class="ml-2 hover:scale-105 px-3 py-2 rounded-lg transition duration-300 ease-in-out gap-3 bg-gradient-to-tl from-black to-[200%] to-white text-white flex items-center cursor-pointer"
        >
          <span class="text-base">Actualizar</span>
          <span>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-6 w-6"
              viewBox="0 0 24 24"
              fill="currentColor"
              aria-hidden="true"
            >
              <path
                d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"
              />
            </svg>
          </span>
        </button>
      </h2>
      <div class="flex items-center gap-2">
        <div class="flex items-center border-b rounded-lg rounded-b-none">
          <input
            type="text"
            placeholder="Buscar..."
            class="px-4 py-2 min-w-sm focus:outline-none"
          />
          <button class="px-2">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5 text-gray-500"
              viewBox="0 0 20 20"
              fill="currentColor"
              aria-hidden="true"
            >
              <path
                fill-rule="evenodd"
                d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1111.293 3.707l4 4a1 1 0 01-1.414 1.414l-4-4A6 6 0 012 8z"
                clip-rule="evenodd"
              />
            </svg>
          </button>
        </div>
      </div>
    </div>
    <div class="flex justify-center">
      <table class="w-full mt-5 bg-white rounded-xl">
        <thead class="text-gray-600 text-sm uppercase font-semibold">
          <tr>
            <th class="px-6 py-3 text-center"></th>
            <th class="px-6 py-3 text-center">Referencia</th>
            <th class="px-6 py-3 text-center">Estado</th>
            <th class="px-6 py-3 text-center">Fecha</th>
            <th class="px-6 py-3 text-center">Acciones</th>
          </tr>
        </thead>
        <tbody class="text-gray-600 text-sm font-light">
          <tr class="border-b border-gray-200 text-center">
            <td
              class="px-6 py-6 whitespace-nowrap group overflow-hidden to-white"
            >
              <div class="bg-radial from-gray-400/90 rounded-lg">
                <img
                  class="w-36 -translate-6 group-hover:translate-2 scale-150 transition aspect-square mx-auto"
                  src="renders/automovil-render.png"
                  alt=""
                />
              </div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap">Servicio 1</td>
            <td class="px-6 py-4 whitespace-nowrap">Pendiente</td>
            <td class="px-6 py-4 whitespace-nowrap">2023/10/01</td>
            <td
              class="px-6 py-4 whitespace-nowrap flex flex-row gap-4 justify-center h-[200px] items-center"
            >
              <a
                [routerLink]="['show/1']"
                class="text-white cursor-pointer rounded-lg font-semibold bg-black px-5 py-2 text-base hover:bg-black/80 transition shadow"
              >
                Revisar
              </a>
              <button
                class="text-black outline shadow text-base hover:bg-gray-300 cursor-pointer rounded-lg font-semibold px-5 py-2 hover:brightness-110 transition"
              >
                Cancelar
              </button>
            </td>
          </tr>
          <!-- Repeat rows as needed -->
        </tbody>
      </table>
    </div>
  </div>
</div>
