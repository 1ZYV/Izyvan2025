<div class="grid grid-cols-2 ">
  <!-- Left column for service request form -->
  <div class="w-2xl rounded-sm mx-auto py-4 px-10 flex flex-col gap-5 max-h-[89vh] overflow-y-scroll">
    <h2 class="text-4xl border-b py-2.5 text-center border-gray-300 font-semibold">
      Solicitar nuevo Servicio
    </h2>

    <!-- Section for selecting origin and destination -->
    <div class="flex flex-col gap-5">
      <h3 class="text-xl font-semibold">
        Selecciona el lugar de origen y destino
      </h3>
      <!-- Autocomplete component for place selection -->
      <app-place-autocomplete />

      <!-- Section for selecting vehicle type -->
      <div class="flex flex-col gap-2">
        <label for="vehicleType" class="text-gray-500">
          Selecciona el tipo de vehículo
        </label>
        <!-- Component for vehicle type selection -->
        <app-vehicle-type-selector />
      </div>
    </div>

    <form class="flex flex-col gap-5" [formGroup]="serviceRequestForm">
      <div class="flex flex-col gap-2 mx-4">
        <div class="flex flex-row items-center gap-3">
          <input class="size-6" id="hasTourism" type="checkbox" formControlName="includeTourismGuide">
          <label for="hasTourism" class="text-lg font-semibold">Incluir servicio de guía turístico</label>
        </div>

        <p class="text-sm text-gray-400">Este servicio es opcional, se le cobrará una tarifa adicional para los guías de
          turismo que incluya el servicio.</p>
      </div>

      <div class="flex flex-col gap-5">
        <h3 class="text-xl font-semibold">Información adicional del servicio</h3>
        <div class="flex flex-row gap-5">
          <div class="flex flex-col w-full gap-2">
            <label for="date" class="text-gray-500">Fecha del servicio</label>
            <input type="date" class="border border-gray-300 w-full block rounded px-4 py-2" name="date" id="date"
              formControlName="date" />
          </div>
          <div class="flex flex-col w-full gap-2">
            <label for="time" class="text-gray-500">Hora del servicio</label>
            <input type="time" class="border border-gray-300 w-full block rounded px-4 py-2" name="time" id="time"
              formControlName="time" />
          </div>
        </div>
        <div class="flex flex-col gap-2">
          <label for="reference" class="text-gray-500">
            Referencia del servicio
          </label>
          <input type="text" class="border border-gray-300 rounded px-4 py-2" name="reference" id="reference"
            formControlName="nameReference" />
        </div>
        <div class="flex flex-col gap-2">
          <label for="passengerNumber" class="text-gray-500">
            Número de pasajeros
          </label>
          <input type="number" min="0" max="30" class="border border-gray-300 rounded px-4 py-2" name="passengerNumber"
            id="passengerNumber" formControlName="passengerNumber" />
        </div>
        <div class="flex flex-col gap-5">
          <div class="flex flex-col gap-2">
            <label for="description" class="text-gray-500">
              Descripción del servicio
            </label>
            <textarea name="description" id="description" rows="4"
              class="border border-gray-300 resize-none rounded px-4 py-2" formControlName="description"></textarea>
          </div>
        </div>
      </div>

      <button type="button" (click)="handleSubmitServiceRequest()"
        class="w-full px-4 py-2 rounded-lg bg-blue-500 text-white">Agendar
        servicio</button>
    </form>
  </div>
  <!-- Right column for displaying map directions -->
  <app-service-request-map-direction [center]="center()" [width]="'100%'" [height]="'90vh'" [zoom]="zoom()"
    [coords]="true" />
  <!-- Indicates that map should use coordinates from booking service -->
</div>
