<form class="flex flex-col gap-5 items-center justify-center h-full w-full">
  <div class="flex flex-col gap-3">
    <label for="email" class="text-lg font-medium"
      >Correo Electrónico <span class="text-red-500">*</span>
    </label>
    <input
      id="email"
      type="text"
      placeholder="Email"
      class="flex min-w-md outline rounded-md shadow-md px-5 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
    />
  </div>
  <div class="flex flex-col gap-3">
    <label for="password" class="text-lg font-medium"
      >Contraseña <span class="text-red-500">*</span></label
    >
    <input
      id="password"
      type="password"
      placeholder="Password"
      class="flex min-w-md outline rounded-md shadow-md px-5 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
    />
  </div>

  <button
    type="submit"
    class="w-md bg-gradient-to-bl from-blue-600 to-blue-400 text-white font-bold py-2 px-4 rounded-lg shadow-md hover:brightness-95 transition duration-200"
  >
    Iniciar sesión
  </button>
</form>
