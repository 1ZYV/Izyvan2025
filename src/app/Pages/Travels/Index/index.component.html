<cp-travel-header></cp-travel-header>

<div class="mt-4">
    <div class="flex justify-between items-center mb-6">
        <p class="text-2xl font-semibold">Todos los viajes</p>
        <button
            class="bg-black text-white px-6 py-2 rounded-lg font-medium hover:bg-gray-800 transition-colors flex items-center gap-2"
            (click)="onCreateTravel()" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 5v14m-7-7h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
            Agendar viaje
        </button>
    </div>

    <!-- Loading state -->
    @if (isLoading()) {
    <cp-loader message="Cargando viajes..." size="medium" variant="primary" [centered]="true">
    </cp-loader>
    }

    <!-- Lista de viajes -->
    @if (!isLoading() && travelsList().length > 0) {
    <div class="space-y-4">
        @for (travel of travelsList(); track travel.id) {
        <cp-travel-card [travel]="travel" (detailsClick)="onViewDetails($event)" (cardClick)="onCardClick($event)">
        </cp-travel-card>
        }
    </div>
    }

    <!-- Estado vacío -->
    @if (!isLoading() && travelsList().length === 0) {
    <cp-empty-state icon="🚗" title="No tienes viajes" description="Cuando tengas viajes programados aparecerán aquí."
        actionText="Programar viaje" [showAction]="true" [onActionClick]="onCreateTravel">
    </cp-empty-state>
    }
</div>
