<div class="login-container">
    <div class="login-card">
        <!-- Header -->
        <div class="login-header">
            <div class="login-logo">
                <img src="assets/logo.jpeg" alt="IzyTracking Logo" class="logo-image">
                <h1 class="logo-text">IzyTracking</h1>
            </div>
            <p class="login-subtitle">Inicia sesión en tu cuenta</p>
        </div>

        <!-- Form -->
        <form (ngSubmit)="onSubmit()" class="login-form">
            <!-- Email Field -->
            <div class="form-group">
                <label for="email" class="form-label">Correo electrónico</label>
                <input type="email" id="email" name="email" [(ngModel)]="email" class="form-input"
                    placeholder="tu@ejemplo.com" required autocomplete="email">
            </div>

            <!-- Password Field -->
            <div class="form-group">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" id="password" name="password" [(ngModel)]="password" class="form-input"
                    placeholder="••••••••" required autocomplete="current-password">
            </div>

            <!-- Error Message -->
            @if (errorMessage) {
            <div class="error-message">
                <svg class="error-icon" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd"
                        d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
                        clip-rule="evenodd"></path>
                </svg>
                {{ errorMessage }}
            </div>
            }

            <!-- Submit Button -->
            <button type="submit" class="login-button" [disabled]="isLoading">
                @if (isLoading) {
                <svg class="loading-spinner" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor"
                        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                    </path>
                </svg>
                Iniciando sesión...
                } @else {
                Iniciar sesión
                }
            </button>
        </form>

        <!-- Demo Login -->
        <div class="demo-section">
            <div class="divider">
                <span class="divider-text">o</span>
            </div>

            <button type="button" (click)="loginAsDemo()" class="demo-button" [disabled]="isLoading">
                <svg class="demo-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                Probar con usuario demo
            </button>
        </div>
    </div>
</div>
